apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: tidb-dev
  namespace: tidb-dev
spec:
  version: v7.1.0
  timezone: UTC
  pvReclaimPolicy: Retain

  pd:
    replicas: 1
    requests:
      storage: "1Gi"
    storageClassName: standard

  tikv:
    replicas: 2
    requests:
      storage: "2Gi"
    storageClassName: standard

  tidb:
    replicas: 1
    service:
      type: ClusterIP
    requests:
      cpu: "500m"
      memory: "512Mi"
